<!DOCTYPE html>
<html lang="en-AU"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your profile — BuildSafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head><body>

<div class="ob"><div class="ob-card">
  <a class="logo" href="index.html" style="margin-bottom:1.4rem"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>BuildSafe</a>
  <div class="prog"><i class="on" id="p1"></i><i id="p2"></i><i id="p3"></i></div>

  <!-- STEP 1: role -->
  <div class="ob-step on" id="s1">
    <h2>Who are you on the site?</h2>
    <p class="sub" style="margin-top:.6rem">Pick your side — your profile and app are built around it. (You can add another role later.)</p>
    <div class="roles">
      <button class="role" data-role="customer">
        <span class="ic" style="background:var(--cloud);color:var(--navy)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 4l9 6.5"/><path d="M5 10v10h14V10"/></svg></span>
        <b>I'm a customer</b><span>Hiring a builder or tradie for my home or project</span>
      </button>
      <button class="role" data-role="tradie">
        <span class="ic" style="background:var(--osoft);color:var(--orange)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 00-6.4 6.4L3 18v3h3l5.3-5.3a4.5 4.5 0 006.4-6.4L14 13l-3-3z"/></svg></span>
        <b>I'm a tradie / subbie</b><span>I work under builders and want to get paid safely</span>
      </button>
      <button class="role" data-role="builder">
        <span class="ic" style="background:var(--csoft);color:var(--clear)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8V6a2 2 0 012-2h6a2 2 0 012 2v2M12 12v4"/></svg></span>
        <b>I'm a builder</b><span>I hire trades, run projects, and want to prove I'm solid</span>
      </button>
    </div>
    <div class="ob-nav"><span></span><button class="btn btn-p" id="n1" disabled>Continue →</button></div>
  </div>

  <!-- STEP 2: details (role-tailored) -->
  <div class="ob-step" id="s2">
    <h2 id="s2-title">Your details</h2>
    <p class="sub" style="margin:.6rem 0 1.4rem" id="s2-sub"></p>
    <div class="form">
      <div class="f2">
        <label>Full name<input type="text" id="f-name" placeholder="e.g. Parth Chavda"></label>
        <label>Email<input type="email" id="f-email" placeholder="you@example.com.au"></label>
      </div>
      <div class="f2">
        <label>Suburb<input type="text" id="f-suburb" placeholder="e.g. Clyde North VIC"></label>
        <label id="l-abn" hidden>ABN <span class="hint">— verified against ABN Lookup at launch</span><input type="text" id="f-abn" placeholder="XX XXX XXX XXX"></label>
      </div>
      <div id="tradie-extra" hidden>
        <label style="margin-bottom:.5rem">Your trades <span class="hint">— pick all that apply</span></label>
        <div class="chips" id="trade-chips"></div>
        <div class="f2" style="margin-top:1rem">
          <label>Licence / rego # <span class="hint">(if your trade needs one)</span><input type="text" id="f-lic" placeholder="e.g. VBA / plumbing rego"></label>
          <label>Public liability insurance<input type="text" id="f-ins" placeholder="Insurer · amount · expiry"></label>
        </div>
      </div>
      <div id="builder-extra" hidden>
        <div class="f2">
          <label>Company name<input type="text" id="f-co" placeholder="e.g. Southpoint Projects Pty Ltd"></label>
          <label>Builder licence<input type="text" id="f-blic" placeholder="e.g. VBA DB-U XXXXX"></label>
        </div>
        <label>What do you build? <span class="hint">— shows on your public profile</span>
          <div class="chips" id="build-chips"></div></label>
      </div>
      <div id="cust-extra" hidden>
        <label>What are you planning?<select id="f-proj"><option>New home build</option><option>Renovation / extension</option><option>Townhouse / development</option><option>Repairs & small works</option></select></label>
      </div>
    </div>
    <div class="ob-nav"><button class="btn btn-g" data-back="1">← Back</button><button class="btn btn-p" id="n2">Continue →</button></div>
  </div>

  <!-- STEP 3: done -->
  <div class="ob-step" id="s3">
    <div style="text-align:center;padding:1rem 0 0">
      <span class="av-xl avatar" id="done-av" style="background:linear-gradient(135deg,var(--orange),var(--orange2));margin:0 auto 1.2rem">🙂</span>
      <h2 id="done-h">Profile created</h2>
      <p class="sub" style="max-width:44ch;margin:1rem auto 1.6rem" id="done-p"></p>
      <div style="display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-p btn-lg" id="done-cta" href="app-tradie.html">Open my app →</a>
        <a class="btn btn-g btn-lg" href="index.html">Back to home</a>
      </div>
      <p class="hint" style="margin-top:1.4rem">Demo: profiles are session-only. At launch this creates your real account with ABN &amp; licence verification.</p>
    </div>
  </div>
</div></div>

<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
let role=null;
const TRADES=["Tiling","Bricklaying","Carpentry","Electrical","Plumbing","Rendering","Concreting","Plastering","Painting","Roofing","Landscaping","Labouring"];
const BUILDS=["New homes","Townhouses","Renovations","Extensions","Commercial fit-out","Multi-res"];
$("#trade-chips").innerHTML=TRADES.map(t=>`<button type="button" class="chip" data-c>${t}</button>`).join("");
$("#build-chips").innerHTML=BUILDS.map(t=>`<button type="button" class="chip" data-c>${t}</button>`).join("");
document.addEventListener("click",e=>{const c=e.target.closest("[data-c]");if(c)c.classList.toggle("on")});

$$(".role").forEach(r=>r.addEventListener("click",()=>{
  $$(".role").forEach(x=>x.classList.remove("on"));r.classList.add("on");
  role=r.dataset.role;$("#n1").disabled=false;
}));
function go(n){
  $$(".ob-step").forEach(s=>s.classList.remove("on"));$("#s"+n).classList.add("on");
  for(let i=1;i<=3;i++)$("#p"+i).classList.toggle("on",i<=n);
  window.scrollTo({top:0});
}
$("#n1").addEventListener("click",()=>{
  const map={customer:["Tell us about you","So verified builders can quote your project properly."],
    tradie:["Build your tradie profile","This is what builders see when you apply — licence and insurance get you hired faster."],
    builder:["Set up your builder profile","This becomes your public page — customers and subbies both see it."]};
  $("#s2-title").textContent=map[role][0];$("#s2-sub").textContent=map[role][1];
  $("#l-abn").hidden = role==="customer";
  $("#tradie-extra").hidden = role!=="tradie";
  $("#builder-extra").hidden = role!=="builder";
  $("#cust-extra").hidden = role!=="customer";
  go(2);
});
$$("[data-back]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.back)));
$("#n2").addEventListener("click",()=>{
  const nm=$("#f-name").value.trim()||"there";
  $("#done-av").textContent=nm==="there"?"✓":nm.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const cta=$("#done-cta");
  if(role==="customer"){cta.href="app-customer.html";$("#done-h").textContent="Welcome, "+nm.split(" ")[0]+" — let's find you a safe builder";$("#done-p").textContent="Your Customer app is ready: search verified builders, read two-way reviews, and run a free deposit-safety check before you pay anyone."}
  if(role==="tradie"){cta.href="app-tradie.html";$("#done-h").textContent="You're set, "+nm.split(" ")[0]+" — protection is on";$("#done-p").textContent="Your Tradie app is ready: add the builders you work under to your watchlist, log your exposure, and browse the job board — zero lead fees."}
  if(role==="builder"){cta.href="app-builder.html";$("#done-h").textContent="Profile live — now get Verified";$("#done-p").textContent="Your Builder app is ready: post jobs, watch your clients and subbies, and apply for the Verified badge that wins nervous customers."}
  toast("Profile saved for this session");
  go(3);
});
</script>
</body></html>
